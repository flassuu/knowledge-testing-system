<?xml version="1.0" encoding="UTF-8"?>
<!--
  LANtern app icon — placeholder artwork.

  A launcher icon cannot be a bare mark: Android, Windows and the Linux desktops
  all need the art inside a filled shape, so the mark sits on a rounded square
  with the brand indigo. Maskable icons need the art inside the safe circle, so
  this file exists at two paddings (see docs/brand/README.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LANtern">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f3ec0" />
      <stop offset="100%" stop-color="#23227a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f4a63a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f4a63a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#field)" />

  <!-- art group: the same geometry as the mark, scaled and centred -->
  <g transform="translate(256 256) scale(9.2) translate(-16 -16)">
    <circle cx="16" cy="17.5" r="11" fill="url(#glow)" />
    <g stroke="#b9b8ff" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M6 8.5h20" />
      <path d="M16 8.5v2.5" />
    </g>
    <g fill="#e1e0ff">
      <rect x="3.6" y="5.4" width="4.8" height="4.8" rx="1.4" />
      <rect x="13.6" y="5.4" width="4.8" height="4.8" rx="1.4" />
      <rect x="23.6" y="5.4" width="4.8" height="4.8" rx="1.4" />
    </g>
    <path d="M13.4 11.6h5.2" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" />
    <path d="M15 11.6V10a1 1 0 0 1 2 0v1.6" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M12.6 11.6h6.8l1 12.2a1.4 1.4 0 0 1-1.4 1.5h-6a1.4 1.4 0 0 1-1.4-1.5z"
          fill="#f4f2ff" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round" />
    <circle cx="16" cy="17" r="3.4" fill="#ffc65c" />
    <path d="M13.2 21.6h5.6" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
  </g>
</svg>