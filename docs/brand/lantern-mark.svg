<?xml version="1.0" encoding="UTF-8"?>
<!--
  LANtern mark — placeholder artwork.

  A lantern (the light in a dark room) hanging over a LAN (four clients on one
  wire). Every icon size in the product is generated from this file, so replacing
  it with the final artwork means editing this file and re-running the export
  command in docs/brand/README.md — nothing else has to change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LANtern">
  <defs>
    <radialGradient id="glow" cx="50%" cy="56%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#f4a63a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f4a63a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- the light it throws: the glow is the point of the name -->
  <circle cx="16" cy="17.5" r="11" fill="url(#glow)" />

  <!-- the LAN: three clients hanging off the same wire -->
  <g stroke="#8f8aa8" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M6 8.5h20" />
    <path d="M16 8.5v2.5" />
  </g>
  <g fill="#4b4acf">
    <rect x="3.6" y="5.4" width="4.8" height="4.8" rx="1.4" />
    <rect x="13.6" y="5.4" width="4.8" height="4.8" rx="1.4" />
    <rect x="23.6" y="5.4" width="4.8" height="4.8" rx="1.4" />
  </g>

  <!-- the lantern -->
  <path d="M13.4 11.6h5.2" stroke="#2b2a35" stroke-width="1.7" stroke-linecap="round" />
  <path d="M15 11.6V10a1 1 0 0 1 2 0v1.6" stroke="#2b2a35" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M12.6 11.6h6.8l1 12.2a1.4 1.4 0 0 1-1.4 1.5h-6a1.4 1.4 0 0 1-1.4-1.5z"
        fill="#e8e4f6" stroke="#2b2a35" stroke-width="1.7" stroke-linejoin="round" />
  <circle cx="16" cy="17" r="3.4" fill="#ffc65c" />
  <path d="M13.2 21.6h5.6" stroke="#2b2a35" stroke-width="1.3" stroke-linecap="round" />
</svg>