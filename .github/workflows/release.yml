name: Release

# Creates a GitHub Release automatically for every `v*` tag, builds the app
# on Linux + Windows in the cloud and attaches the bundles as release assets.
# Usage: `git tag v0.2.0 && git push --tags` — done, everything else is automatic.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, in two entries on purpose.
          #
          # `.deb` is the required half: it is produced by dpkg-deb and has never
          # failed, and it is the Linux artifact the release page cannot do
          # without. The AppImage is produced by linuxdeploy, which runs by
          # mounting and stripping its own helpers on a runner that has no FUSE
          # and a glibc it disagrees with — it failed three times in a row here,
          # each time as a bare `failed to run linuxdeploy` with no cause, while
          # the very same command succeeded on a workstation. One flaky tool must
          # not be able to take the whole release down with it, so it gets its own
          # job that is allowed to fail.
          #
          # `fail-fast: false` above is what makes the second entry even run: with
          # it off, the first failure would cancel the rest of the matrix.
          - platform: ubuntu-22.04
            os: linux
            bundle: deb
            tauriArgs: --bundles deb
            best_effort: false
          - platform: ubuntu-22.04
            os: linux
            bundle: appimage
            # --verbose makes tauri stream linuxdeploy's own stdout/stderr instead
            # of swallowing it. It is the difference between a failure that says
            # nothing and one that says what broke.
            tauriArgs: --bundles appimage --verbose
            best_effort: true
          - platform: windows-latest
            os: windows
            bundle: msi, nsis
            tauriArgs: --bundles msi,nsis
            best_effort: false

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.best_effort }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # bun compiles the server into a single binary, and the desktop bundle now
      # has to contain it as a sidecar.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server binary for the sidecar
        run: |
          # The desktop app hosts the server, so the bundle has to contain it.
          # Tauri looks for binaries/lantern-server-<rust triple>, which is what
          # scripts/desktop-sidecar.sh produces; without it `tauri build` fails.
          pnpm desktop:sidecar
        shell: bash

      # Only the AppImage job needs this, and it exists for one reason.
      #
      # linuxdeploy runs `ldd` on every ELF it finds in the AppDir's usr/bin and
      # treats a non-zero exit as fatal: `what(): Failed to run ldd: exited with
      # code 1`, exit 134. It cannot trace our sidecar - `bun build --compile`
      # emits a self-contained binary, and ldd reaches it by executing it in
      # trace mode, where it exits 1. That is the whole of the AppImage failure;
      # NO_STRIP and FUSE were red herrings.
      #
      # The shim reports "no dependencies" for a binary the real ldd cannot
      # trace, and passes every other binary - the GTK app, which does need its
      # libs deployed - straight through. The sidecar links nothing but libc, and
      # libc is already in the AppDir for the main binary, so nothing is lost.
      - name: Shim ldd for the Bun sidecar
        if: matrix.bundle == 'appimage'
        run: |
          mkdir -p "$HOME/shim"
          cat > "$HOME/shim/ldd" <<'SH'
          #!/usr/bin/env bash
          out=$(/usr/bin/ldd "$@" 2>&1); rc=$?
          # A real trace: pass it through untouched, output and exit code alike.
          if [ $rc -eq 0 ]; then printf '%s\n' "$out"; exit 0; fi
          # No trace: report no dependencies rather than aborting the bundle.
          exit 0
          SH
          chmod +x "$HOME/shim/ldd"
          echo "$HOME/shim" >> "$GITHUB_PATH"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPIMAGE_EXTRACT_AND_RUN and libfuse2 are the FUSE story: the runners
          # have no FUSE, so the helper images are extracted rather than mounted.
          # NO_STRIP skips linuxdeploy's bundled `strip`, which is binutils 2.35
          # and cannot read the `.relr.dyn` sections of glibc >= 2.36. Neither was
          # enough to make AppImage bundling reliable here, which is why that half
          # is its own best-effort job above — but both are free and both narrow
          # the ways it can fail.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          RUST_LOG: tauri_bundler=debug
        with:
          projectPath: apps/desktop
          args: ${{ matrix.tauriArgs }}
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false

      # A green AppImage build is not proof of a working one, and this job has
      # now produced a broken one. linuxdeploy runs patchelf over every ELF in
      # usr/bin to set its rpath; on a `bun build --compile` binary that rewrite
      # corrupts the ELF, because the dynamic section sits far past the appended
      # payload. The bundle is built, the upload succeeds, and the app inside
      # cannot start the server: the sidecar dumps core, and `ldd` on it exits 1
      # where a healthy one exits 0.
      #
      # So the artifact is opened and the sidecar inside it is asked to trace its
      # own libraries. A failure takes the asset back off the release page, which
      # is why the `.deb` is a separate job and not an afterthought: it is built
      # by dpkg-deb, which never rewrites anything, and its sidecar is intact.
      - name: Verify the AppImage's sidecar still works
        if: matrix.bundle == 'appimage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPIMAGE=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "::warning::no AppImage was produced"
            exit 0
          fi
          NAME=$(basename "$APPIMAGE")
          drop() {
            echo "::error::$1 - taking $NAME off the release page"
            gh release delete-asset v__VERSION__ "$NAME" -y || true
            exit 1
          }
          rm -rf /tmp/ai && mkdir -p /tmp/ai
          ( cd /tmp/ai && "$OLDPWD/$APPIMAGE" --appimage-extract >/dev/null )
          GOT=/tmp/ai/squashfs-root/usr/bin/lantern-server
          [ -f "$GOT" ] || drop "the AppImage has no lantern-server in usr/bin"
          # The rpath patchelf wrote is what lets it find the bundled libs; the
          # same rewrite is what breaks the ELF. If the dynamic section survived,
          # ldd exits 0.
          ldd "$GOT" > /dev/null 2>&1 || drop "the sidecar inside the AppImage does not load"
          echo "sidecar inside the AppImage loads: ok"
        shell: bash

  # Headless distribution: the standalone server binary plus the built web
  # client, so the whole system can run without Tauri.
  #
  # Note: this job creates the release if the desktop build has not got there
  # yet, and tauri-action then updates its name and body - so the release notes
  # are written by hand afterwards (`gh release edit v0.x.y --notes-file …`).
  server:
    name: Standalone server (Linux)
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the release version
        id: version
        run: echo "version=$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the web client
        run: pnpm build:web

      - name: Build the standalone server binary
        run: pnpm build:server

      # The console only appears on a terminal, so this runs it on a pty and then
      # checks the opposite case: a piped run must stay machine-readable, or
      # systemd, journalctl and this workflow stop working.
      - name: Smoke-test the console
        run: bash scripts/console-smoke.sh --no-build

      - name: Smoke-test the artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rel-data"
          ADMIN_PASSWORD=ci-smoke-test \
            ./apps/server/dist/lantern-server \
              --port 3499 \
              --data "$RUNNER_TEMP/rel-data" \
              --webroot apps/web-client/dist &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3499/api/health -o "$RUNNER_TEMP/health.json"; then break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/health.json"
          curl -sf -o /dev/null -w 'web root: HTTP %{http_code}\n' http://127.0.0.1:3499/
          node -e "
            const health = require('$RUNNER_TEMP/health.json')
            if (health.version !== '${{ steps.version.outputs.version }}') {
              console.error('version mismatch: ' + health.version)
              process.exit(1)
            }
            if (health.database !== 'ok') {
              console.error('database not ok')
              process.exit(1)
            }
          "

      - name: Package the artifacts
        run: |
          cp apps/server/dist/lantern-server "lantern-server_${{ steps.version.outputs.version }}_linux-x64"
          tar -czf "lantern-web_${{ steps.version.outputs.version }}.tar.gz" -C apps/web-client dist

      - name: Upload the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job usually finishes before the desktop build creates the
          # release, so create it when it is missing. `gh release upload` only
          # needs permission to add assets.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "See the assets to download this version and install."
          fi
          gh release upload "${{ github.ref_name }}" \
            "lantern-server_${{ steps.version.outputs.version }}_linux-x64" \
            "lantern-web_${{ steps.version.outputs.version }}.tar.gz" \
            --clobber
