name: Release

# Creates a GitHub Release automatically for every `v*` tag, builds the app
# on Linux + Windows in the cloud and attaches the bundles as release assets.
# Usage: `git tag v0.2.0 && git push --tags` — done, everything else is automatic.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # No AppImage, and that is a decision rather than an omission.
          #
          # linuxdeploy rewrites the rpath of every ELF in the AppDir's usr/bin
          # with patchelf, and on our `bun build --compile` sidecar that rewrite
          # corrupts it: the bundle builds, uploads, and the app inside segfaults
          # in silence on startup. Every structural check still passes - readelf
          # is content, ldd is content wherever the libraries resolve - so the
          # only way to notice is to run the artifact, and a file that has to be
          # downloaded and launched before it can be trusted does not belong on a
          # download list.
          #
          # The .deb is built by dpkg-deb, which rewrites nothing, and its sidecar
          # starts and serves. It is the Linux artifact. Building the AppImage
          # again needs the Bun binary moved out of usr/bin into somewhere
          # linuxdeploy does not scan; docs/RELEASE_CHECKLIST.md has the detail.
          - platform: ubuntu-22.04
            os: linux
            bundle: deb
            tauriArgs: --bundles deb
            best_effort: false
          - platform: windows-latest
            os: windows
            bundle: msi, nsis
            tauriArgs: --bundles msi,nsis
            best_effort: false

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.best_effort }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # bun compiles the server into a single binary, and the desktop bundle now
      # has to contain it as a sidecar.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server binary for the sidecar
        run: |
          # The desktop app hosts the server, so the bundle has to contain it.
          # Tauri looks for binaries/lantern-server-<rust triple>, which is what
          # scripts/desktop-sidecar.sh produces; without it `tauri build` fails.
          pnpm desktop:sidecar
        shell: bash


      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPIMAGE_EXTRACT_AND_RUN and libfuse2 are the FUSE story: the runners
          # have no FUSE, so the helper images are extracted rather than mounted.
          # NO_STRIP skips linuxdeploy's bundled `strip`, which is binutils 2.35
          # and cannot read the `.relr.dyn` sections of glibc >= 2.36. Neither was
          # enough to make AppImage bundling reliable here, which is why that half
          # is its own best-effort job above — but both are free and both narrow
          # the ways it can fail.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          RUST_LOG: tauri_bundler=debug
        with:
          projectPath: apps/desktop
          args: ${{ matrix.tauriArgs }}
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false


  # Headless distribution: the standalone server binary plus the built web
  # client, so the whole system can run without Tauri.
  #
  # Note: this job creates the release if the desktop build has not got there
  # yet, and tauri-action then updates its name and body - so the release notes
  # are written by hand afterwards (`gh release edit v0.x.y --notes-file …`).
  server:
    name: Standalone server (Linux)
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the release version
        id: version
        run: echo "version=$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the web client
        run: pnpm build:web

      - name: Build the standalone server binary
        run: pnpm build:server

      # The console only appears on a terminal, so this runs it on a pty and then
      # checks the opposite case: a piped run must stay machine-readable, or
      # systemd, journalctl and this workflow stop working.
      - name: Smoke-test the console
        run: bash scripts/console-smoke.sh --no-build

      - name: Smoke-test the artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rel-data"
          ADMIN_PASSWORD=ci-smoke-test \
            ./apps/server/dist/lantern-server \
              --port 3499 \
              --data "$RUNNER_TEMP/rel-data" \
              --webroot apps/web-client/dist &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3499/api/health -o "$RUNNER_TEMP/health.json"; then break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/health.json"
          curl -sf -o /dev/null -w 'web root: HTTP %{http_code}\n' http://127.0.0.1:3499/
          node -e "
            const health = require('$RUNNER_TEMP/health.json')
            if (health.version !== '${{ steps.version.outputs.version }}') {
              console.error('version mismatch: ' + health.version)
              process.exit(1)
            }
            if (health.database !== 'ok') {
              console.error('database not ok')
              process.exit(1)
            }
          "

      - name: Package the artifacts
        run: |
          cp apps/server/dist/lantern-server "lantern-server_${{ steps.version.outputs.version }}_linux-x64"
          tar -czf "lantern-web_${{ steps.version.outputs.version }}.tar.gz" -C apps/web-client dist

      - name: Upload the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job usually finishes before the desktop build creates the
          # release, so create it when it is missing. `gh release upload` only
          # needs permission to add assets.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "See the assets to download this version and install."
          fi
          gh release upload "${{ github.ref_name }}" \
            "lantern-server_${{ steps.version.outputs.version }}_linux-x64" \
            "lantern-web_${{ steps.version.outputs.version }}.tar.gz" \
            --clobber
